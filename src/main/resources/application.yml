spring:
  datasource:
    url: jdbc:mysql://localhost:3306/virtual_events_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user

  data:
    redis:
      host: localhost
      port: 6379

ollama:
  api:
    url: http://localhost:8000/api/v1/generate-match

security:
  jwt:
    key: ${JWT_KEY}
    expiration: 1640995200
  admin-emails: pasinduogdev@gmail.com

app:
  frontend:
    base-url: ${BASE_URL}